<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camp Tour Messenger</title>
    <!-- Import Google Fonts Mới -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bungee+Spice&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Farsan&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <!-- EXACT STARRY NIGHTS VIDEO -->
    <video src="https://assets.21st.dev/ascii-recipes/videos/user_3CsH4USnadu1DaOGLGegjBVQeA2/d7c70a61-4be8-497b-aa96-728173159d52.mp4" poster="https://assets.21st.dev/ascii-recipes/thumbnails/user_3CsH4USnadu1DaOGLGegjBVQeA2/20b7cadd-f69b-4a89-b3ec-9a1fc455a176.webp" autoplay loop muted playsinline style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: -1;"></video>

    <!-- Glassmorphism Container -->
    <div class="glass-container">
        
        <div class="title-container">
            <h2>Camp Tour Messenger</h2>
        </div>
        
        <div class="form-group">
            <label>Tên Nhóm Chat:</label>
            <input type="text" id="groupName" placeholder="VD: Group Nhận Tour 2026">
        </div>

        <div class="form-group">
            <label>Tên Quản Lý:</label>
            <input type="text" id="managerName" placeholder="VD: Nguyễn Văn A">
        </div>
        
        <div class="form-group">
            <label>Từ khóa báo tour:</label>
            <input type="text" id="keyword" placeholder="VD: ae nhận">
        </div>
        
        <div class="form-group">
            <label>Danh sách trả lời:</label>
            <input type="text" id="replies" placeholder="VD: e, em, dạ em">
        </div>
        
        <div class="flex-group">
            <div class="form-group">
                <label>Min Delay (s):</label>
                <input type="text" id="minDelay" placeholder="0.5">
            </div>
            <div class="form-group">
                <label>Max Delay (s):</label>
                <input type="text" id="maxDelay" placeholder="2">
            </div>
        </div>
        
        <div class="status-container">
            Trạng thái: <span id="statusText" class="status-off">Đang tắt</span>
        </div>
        
        <button id="toggleBtn" class="btn btn-start">Bật Tool</button>

        <!-- Chào Mừng Tiếng Nhật -->
        <div class="japanese-greeting">
            こんにちは！アキです。
        </div>

        <!-- EXACT SPARKLES TEXT (Made by Github) -->
        <div class="credit">
            <span id="sparkles-container" class="relative inline-block">
                Made by Github: <a href="https://github.com/LDP-cyber" target="_blank" style="position:relative; z-index: 2;">LDP-cyber</a>
            </span>
        </div>
    </div>
    
    <!-- MÔ PHỎNG MAGIC UI REACT -> VANILLA JS -->
    <script>
        const colors = { first: "#9E7AFF", second: "#FE8BBB" };
        const sparklesCount = 10;
        const container = document.getElementById('sparkles-container');
        let sparklesData = [];

        function generateStar() {
            return {
                id: Math.random().toString(36).substring(2) + Date.now(),
                x: `${Math.random() * 100}%`,
                y: `${Math.random() * 100}%`,
                color: Math.random() > 0.5 ? colors.first : colors.second,
                delay: Math.random() * 2,
                scale: Math.random() * 1 + 0.3,
                lifespan: Math.random() * 10 + 5
            };
        }

        function createStarElement(star) {
            const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg.setAttribute('viewBox', '0 0 21 21');
            svg.setAttribute('width', '21');
            svg.setAttribute('height', '21');
            svg.classList.add('sparkle-exact');
            svg.id = `sparkle-${star.id}`;
            
            svg.style.left = star.x;
            svg.style.top = star.y;
            svg.style.animationDelay = `${star.delay}s`;
            svg.style.setProperty('--sparkle-scale', star.scale);
            
            // EXACT SVG PATH từ Framer Motion Component
            svg.innerHTML = `<path d="M9.82531 0.843845C10.0553 0.215178 10.9446 0.215178 11.1746 0.843845L11.8618 2.72026C12.4006 4.19229 12.3916 6.39157 13.5 7.5C14.6084 8.60843 16.8077 8.59935 18.2797 9.13822L20.1561 9.82534C20.7858 10.0553 20.7858 10.9447 20.1561 11.1747L18.2797 11.8618C16.8077 12.4007 14.6084 12.3916 13.5 13.5C12.3916 14.6084 12.4006 16.8077 11.8618 18.2798L11.1746 20.1562C10.9446 20.7858 10.0553 20.7858 9.82531 20.1562L9.13819 18.2798C8.59932 16.8077 8.60843 14.6084 7.5 13.5C6.39157 12.3916 4.19225 12.4007 2.72023 11.8618L0.843814 11.1747C0.215148 10.9447 0.215148 10.0553 0.843814 9.82534L2.72023 9.13822C4.19225 8.59935 6.39157 8.60843 7.5 7.5C8.60843 6.39157 8.59932 4.19229 9.13819 2.72026L9.82531 0.843845Z" fill="${star.color}"/>`;
            
            return svg;
        }

        for (let i = 0; i < sparklesCount; i++) {
            const star = generateStar();
            sparklesData.push(star);
            container.appendChild(createStarElement(star));
        }

        setInterval(() => {
            sparklesData = sparklesData.map(star => {
                if (star.lifespan <= 0) {
                    const oldEl = document.getElementById(`sparkle-${star.id}`);
                    if (oldEl) oldEl.remove();
                    
                    const newStar = generateStar();
                    container.appendChild(createStarElement(newStar));
                    return newStar;
                } else {
                    return { ...star, lifespan: star.lifespan - 0.1 };
                }
            });
        }, 100);
    </script>
    <script src="popup.js"></script>
</body>
</html>
